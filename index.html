<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLHS Examination</title>
    <script src="index.js" type="module" defer></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="frame">
        <h2 class="title dm-sans">CLHS Examination Display</h2>
        <h1 class="instruction dm-sans">Select your form</h1>
        <p class="note dm-sans">You may only open the display 30 minutes before the paper begins.</p>
        <select name="form" id="sel-form" class="form dm-sans">
            <option disabled="true" value="F1">Form 1</option>
            <option disabled="true" value="F2">Form 2</option>
            <option disabled="true" value="F3">Form 3</option>
            <option disabled="true" value="F4">Form 4</option>
            <option value="F5">Form 5</option>
        </select>
        <button id="cfm" class="button dm-sans">Confirm</button>
    </div>
</body>
</html>
